name: Feature request
description: Suggest a capability or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or impossible today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What the feature should do, from the reader's point of view.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platforms concerned
      multiple: true
      options:
        - iPhone
        - iPad
        - Mac
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways of solving the same problem, and why they are worse.
