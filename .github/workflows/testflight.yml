# Builds Flong for iOS and hands the result to TestFlight.
#
# Signing is automatic : the distribution certificate comes in from a secret,
# and `-allowProvisioningUpdates` lets Xcode create and download whatever
# provisioning profile the archive needs, using the App Store Connect key
# rather than an Apple ID. The upload is `-exportArchive` itself, through
# `destination: upload` in the export options, so there is no second tool.
#
# The secrets this needs are described in `docs/technical/deployment.md`.

name: TestFlight

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# A second upload of the same build number is refused by App Store Connect,
# so two runs must never overlap. A queued run still gets its turn.
concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

env:
  SCHEME: Flong
  PROJECT: Flong.xcodeproj

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # The runner image carries several Xcodes and the default is not always
      # the newest. Flong deploys to iOS 26, so anything older cannot build it.
      - name: Select Xcode
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26 on this runner image."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Lint
        run: xcrun swift-format lint --recursive --strict Flong FlongTests FlongUITests

      # The runtimes on a runner image are not the ones installed locally, so
      # the destination names a device and lets the image pick the runtime.
      - name: Unit tests
        run: |
          set -euo pipefail
          if xcrun simctl list devices available | grep -q "iPhone 17 Pro ("; then
            device="iPhone 17 Pro"
          else
            device=$(xcrun simctl list devices available | grep -oE "iPhone [^(]*" | tail -1 | xargs)
            echo "::warning::iPhone 17 Pro is not on this image, testing on $device."
          fi
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$device" \
            -skip-testing:FlongUITests

      # The certificate goes into a keychain of this run's own, which is
      # deleted at the end whatever happens. The App Store Connect key is
      # written where `xcodebuild` is told to read it, and nowhere else.
      - name: Prepare signing
        env:
          CERTIFICATE_P12: ${{ secrets.DIST_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DIST_CERTIFICATE_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          certificate="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$CERTIFICATE_P12" | base64 -D > "$certificate"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$certificate"

          # Without this, codesign stops to ask for permission and the run
          # hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Flong.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          # The team is already in the project ; repeating it in a secret would
          # be one more thing to keep in step for no privacy gained.
          TEAM_ID=$(xcodebuild -project "$PROJECT" -scheme "$SCHEME" -showBuildSettings \
            | awk '/ DEVELOPMENT_TEAM = /{print $3; exit}')
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>uploadSymbols</key>
              <true/>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Flong.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/certificate.p12"
